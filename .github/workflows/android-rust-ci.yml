name: BedrockDroid RS Android + Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # Job 1: formatting, lints and unit tests (host, sin Android SDK)
  checks:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core -> target
          key: ${{ hashFiles('rust-core/Cargo.lock') }}

      - name: cargo fmt --check
        working-directory: rust-core
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings
        working-directory: rust-core
        run: cargo clippy --locked --lib -- -D warnings

      - name: cargo test --locked
        working-directory: rust-core
        run: cargo test --locked --lib

  # Job 2: librerías nativas para los 3 ABIs (incluido x86_64 para el emulador)
  build-rust:
    name: build Rust .so (arm64 / armv7 / x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Android SDK y NDK 27.2.12479018
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Unificar variables NDK
        run: |
          NDK_PATH="${{ env.ANDROID_HOME }}/ndk/27.2.12479018"
          for v in ANDROID_NDK_HOME ANDROID_NDK ANDROID_NDK_ROOT NDK_HOME; do
            echo "${v}=${NDK_PATH}" >> $GITHUB_ENV
          done

      - name: Configurar Rust toolchain con targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core -> target
          key: ${{ hashFiles('rust-core/Cargo.lock') }}

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk

      - name: Compilar .so con SSE2 para x86_64
        working-directory: rust-core
        env:
          RUSTFLAGS: '-C target-feature=+sse2 -C link-arg=-Wl,-z,max-page-size=16384'
          CARGO_NDK_NO_STRIP: 1
        run: |
          mkdir -p ../app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Publicar librerías nativas
        uses: actions/upload-artifact@v4
        with:
          name: bedrockdroid-rs-native-libs
          path: app/src/main/jniLibs/
          if-no-files-found: error

  # Job 3: APK de depuración con artefactos descargables
  build-apk:
    name: build APK (assembleDebug)
    runs-on: ubuntu-latest
    needs: build-rust
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Descargar librerías nativas del job anterior
        uses: actions/download-artifact@v4
        with:
          name: bedrockdroid-rs-native-libs
          path: app/src/main/jniLibs/

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK (assembleDebug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: bedrockdroid-rs-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
